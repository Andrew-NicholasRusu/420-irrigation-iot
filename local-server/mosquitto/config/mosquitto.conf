# Mosquitto 2.x needs an explicit listener to accept connections from other machines.
listener 1883 0.0.0.0

# Classroom setting: no username/password. Add password_file before using a shared network.
allow_anonymous true

# Keep retained messages and queued QoS 1 messages when the container restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
